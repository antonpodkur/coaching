# Local Postgres for development: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: coaching
      POSTGRES_DB: coaching
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
