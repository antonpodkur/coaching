<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121212" />
    <title>Daria Khyzhniak — тренування</title>
    <!-- Installed on a phone: the app's name and icon, full screen, with the
         page running under a see-through status bar (see .screen padding). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Тренування" />
    <!-- Telegram's Mini App SDK has to load before the app so it can read the
         launch parameters from the URL. Outside Telegram it does nothing. A
         copy is served with the app (`pnpm update:telegram` refreshes it), so
         a weak connection can't hold the page up. -->
    <script src="/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Notes over the bottom of the screen (BottomNote). -->
    <div id="notes" class="notes"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
